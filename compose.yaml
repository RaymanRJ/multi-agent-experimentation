services:
  mc:
    image: itzg/minecraft-server
    container_name: mae-mc
    ports:
      - "25565:25565"      # minecraft
      - "25575:25575"      # rcon — scenario toggles
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.1"
      MEMORY: 2G

      # Required for headless agents: skips the Mojang ownership check.
      # Consequence: NEVER expose this server to the internet. LAN only.
      ONLINE_MODE: "FALSE"

      MODE: survival
      DIFFICULTY: peaceful          # scenario runner overrides this at runtime
      SEED: "multiagent"            # fixed seed so runs are comparable (itzg reads SEED, not LEVEL_SEED)
      VIEW_DISTANCE: "8"            # keep RAM down on a 16GB machine
      SIMULATION_DISTANCE: "6"
      SPAWN_PROTECTION: "0"
      MAX_PLAYERS: "10"

      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "devpassword"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
    volumes:
      - ./world:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s

  # ---- Node side: minds panel + agents. `mc` above is unchanged. ----

  minds:
    build: .
    image: mae-node
    container_name: mae-minds
    command: ["npm", "run", "minds"]
    ports:
      - "3010:3010"
    volumes:
      - ./runs:/app/runs
    restart: unless-stopped

  # Agents are opt-in: plain `docker compose up -d` still starts only mc.
  #   docker compose --profile agents up -d agent-ollama
  # They run one episode and stop (restart: "no").
  # Keys come from .env / the shell only. Never put them in this file.
  agent-ollama:
    profiles: ["agents"]
    build: .
    image: mae-node
    container_name: mae-agent-ollama
    command: ["npm", "run", "agent", "--", "--brain", "ollama", "--name", "agent_ollama",
              "--scenario", "${SCENARIO:-sandbox}", "--steps", "${STEPS:-12}", "--goal", "${GOAL:-}", "--view", "3007"]
    ports: ["3007:3007"]
    env_file:
      - path: .env
        required: false
    environment:
      MC_HOST: mc
      OLLAMA_URL: http://host.docker.internal:11434/v1   # Ollama runs natively on the host
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"              # needed on Linux; harmless on Mac
    volumes:
      - ./runs:/app/runs
    depends_on:
      mc:
        condition: service_healthy
    restart: "no"

  agent-claude:
    profiles: ["agents"]
    build: .
    image: mae-node
    container_name: mae-agent-claude
    command: ["npm", "run", "agent", "--", "--brain", "claude", "--name", "agent_claude",
              "--scenario", "${SCENARIO:-sandbox}", "--steps", "${STEPS:-12}", "--goal", "${GOAL:-}", "--view", "3008"]
    ports: ["3008:3008"]
    env_file:
      - path: .env
        required: false
    environment:
      MC_HOST: mc
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./runs:/app/runs
    depends_on:
      mc:
        condition: service_healthy
    restart: "no"

  agent-gpt:
    profiles: ["agents"]
    build: .
    image: mae-node
    container_name: mae-agent-gpt
    command: ["npm", "run", "agent", "--", "--brain", "gpt", "--name", "agent_gpt",
              "--scenario", "${SCENARIO:-sandbox}", "--steps", "${STEPS:-12}", "--goal", "${GOAL:-}", "--view", "3009"]
    ports: ["3009:3009"]
    env_file:
      - path: .env
        required: false
    environment:
      MC_HOST: mc
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./runs:/app/runs
    depends_on:
      mc:
        condition: service_healthy
    restart: "no"

  # OPTIONAL, Linux + NVIDIA hosts ONLY. NOT for Mac: Docker on macOS cannot use Metal,
  # so this would run on CPU and be unusably slow. On a Mac use the Homebrew service
  # (`brew install ollama && brew services start ollama`) instead.
  #   docker compose --profile ollama-docker up -d ollama
  # then point agents at it with OLLAMA_URL=http://ollama:11434/v1
  ollama:
    profiles: ["ollama-docker"]
    image: ollama/ollama
    container_name: mae-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama:
