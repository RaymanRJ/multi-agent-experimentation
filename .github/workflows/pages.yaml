name: pages

# Deploys the site (src/site) to GitHub Pages, as well as or instead of S3 + CloudFront (site.yaml).
# The build is the same: relative asset paths and hash routes, so it works at
# https://<owner>.github.io/multi-agent-experimentation/ without changes.
#
# To use it: Settings → Pages → Source: "GitHub Actions". Then either run this workflow by hand
# (Actions tab), or set the repository variable SITE_ON_PAGES to "true" to deploy on every push to
# main that touches the site or the docs. Until that variable is set, pushes skip the deploy, so the
# workflow never fails on a repository without Pages turned on.

on:
  push:
    branches: [main]
    paths:
      - "src/site/**"
      - "docs/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.SITE_ON_PAGES == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/site/package-lock.json

      - run: npm ci

      # Runs tsc first, so this is also the type-check.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
