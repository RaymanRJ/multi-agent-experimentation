<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent minds</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --raised: #f9fafb; --fg: #14161a; --mute: #5b6270; --faint: #8a909c;
  --line: #e1e4ea; --accent: #2f5bd3; --accent-soft: #e6ecfb;
  --ok: #137a3a; --ok-soft: #e3f4ea; --bad: #b4232a; --bad-soft: #fbe6e7; --warn: #8a5a00; --warn-soft: #fdf1d8;
  --live: #16a34a; --code: #f1f3f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --panel: #171a20; --raised: #1d2128; --fg: #eef0f3; --mute: #a3a9b5; --faint: #737a87;
    --line: #2a2f38; --accent: #86a8ff; --accent-soft: #1f2a44;
    --ok: #5fd68b; --ok-soft: #15301f; --bad: #ff8a8f; --bad-soft: #3a1a1c; --warn: #f0c060; --warn-soft: #362a12;
    --live: #4ade80; --code: #12151a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

/* Run list */
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 16px 18px 10px; }
.brand h1 { margin: 0; font-size: 17px; }
.brand .sub { color: var(--mute); font-size: 13px; }
.controls { display: flex; gap: 14px; padding: 0 18px 12px; font-size: 13px; color: var(--mute); border-bottom: 1px solid var(--line); }
.controls label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
#runs { overflow-y: auto; flex: 1; }
.group { padding: 14px 18px 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.run { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 18px; cursor: pointer; border-left: 3px solid transparent; }
.run:hover { background: var(--raised); }
.run.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.run .top { display: flex; align-items: center; gap: 8px; }
.run .name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.run .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
.run .meta { color: var(--mute); font-size: 12.5px; margin: 2px 0 6px 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .pips { margin-left: 16px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.running { background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 2s infinite; }
.dot.stopped { background: var(--bad); }
.dot.met { background: var(--ok); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.5); } 70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
.pips { display: flex; gap: 3px; }
.pip { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.pip.on { background: var(--ok); }

/* Main */
main { overflow-y: auto; min-width: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 22px 28px 60px; }
.empty { color: var(--mute); text-align: center; padding: 120px 20px; font-size: 17px; }
.head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.head > div:first-child { min-width: 0; flex: 1 1 320px; }
.head h2 { margin: 0; font-size: 24px; line-height: 1.2; }
.head .brain { color: var(--mute); margin-top: 2px; }
.head .goal { margin-top: 8px; font-size: 15px; }
.head .goal b { font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge.running { background: var(--ok-soft); color: var(--ok); }
.badge.ended { background: var(--raised); color: var(--mute); border: 1px solid var(--line); }
.badge.met { background: var(--ok-soft); color: var(--ok); }
.badge.stopped { background: var(--bad-soft); color: var(--bad); }
.spacer { flex: 1; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--mute); }
.stat .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.deaths { display: grid; gap: 6px; }
.death { display: grid; grid-template-columns: 9em 1fr 9em 9em; gap: 10px; font-size: 13px; }
.death .cause { color: var(--bad); }
.death .where, .death .clock { color: var(--mute); font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .death { grid-template-columns: 1fr 1fr; } }
.card h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

.ladder { display: flex; align-items: flex-start; }
.rung { flex: 1; text-align: center; position: relative; font-size: 12.5px; color: var(--mute); }
.rung::before { content: ""; position: absolute; top: 10px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.rung:first-child::before { display: none; }
.rung.on::before { background: var(--ok); }
.rung .ball { position: relative; z-index: 1; width: 22px; height: 22px; margin: 0 auto 6px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; font-size: 12px; color: transparent; }
.rung.on .ball { background: var(--ok); border-color: var(--ok); color: #fff; }
.rung.on { color: var(--fg); }
.rung .at { color: var(--faint); font-size: 11.5px; }

.now { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; }
.doing { font-size: 19px; font-weight: 650; }
.why { color: var(--mute); margin-top: 4px; }
.plan { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.plan b { font-weight: 600; }
.vitals { display: flex; gap: 16px; flex-wrap: wrap; color: var(--mute); font-size: 13.5px; margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 2px 9px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; }
.chip.craft { background: var(--ok-soft); border-color: transparent; color: var(--ok); font-weight: 600; }
.sublabel { font-size: 12px; color: var(--faint); margin: 12px 0 6px; }

/* Timeline */
.tl-head { display: flex; align-items: baseline; gap: 12px; }
.tl-head .hint { color: var(--faint); font-size: 12.5px; }
.item { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; }
.item:first-of-type { border-top: 0; }
.item .n { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.line1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.skill { font-weight: 650; }
.args { color: var(--mute); }
.st { font-size: 12px; font-weight: 650; padding: 1px 8px; border-radius: 999px; }
.st.success { background: var(--ok-soft); color: var(--ok); }
.st.failed { background: var(--bad-soft); color: var(--bad); }
.st.aborted { background: var(--warn-soft); color: var(--warn); }
.times { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.reason { margin-top: 3px; font-size: 14px; }
.reason.failed { color: var(--bad); }
.reason.aborted { color: var(--warn); }
.rat { color: var(--mute); font-size: 14px; margin-top: 3px; }
.rat::before { content: "Why: "; color: var(--faint); }
.small { font-size: 13px; margin-top: 4px; }
.delta { display: inline-flex; gap: 8px; flex-wrap: wrap; font-size: 13px; font-variant-numeric: tabular-nums; }
.plus { color: var(--ok); } .minus { color: var(--bad); }
.note { margin-top: 4px; font-size: 13px; padding: 3px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); display: inline-block; }
.say { margin-top: 4px; font-size: 13.5px; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); display: inline-block; }
.ended-row { margin-top: 4px; font-weight: 650; }
.tools { margin-top: 6px; display: flex; gap: 12px; font-size: 12.5px; color: var(--faint); }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; }
.link:hover { text-decoration: underline; }
.members { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--mute); }
.members li { padding: 2px 0; }
.callbox { margin-top: 8px; }
.callbox .turn { margin-top: 8px; }
.callbox .role { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
.setup-btn { margin-top: 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.setup-btn:hover { border-color: var(--accent); color: var(--accent); }
dialog { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--fg); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.dlg-head { position: sticky; top: 0; display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.dlg-head h3 { margin: 0; font-size: 17px; flex: 1; }
.dlg-close { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--mute); }
.dlg-body { padding: 4px 18px 18px; }
.dlg-body h4 { margin: 16px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; font-size: 14px; }
.kv .k { color: var(--mute); }
.quote { padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: 14.5px; }
pre { margin: 0; font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  main { overflow: visible; }
  .ladder { overflow-x: auto; padding-bottom: 4px; }
  .rung { min-width: 64px; }
  aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .wrap { padding: 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .now { grid-template-columns: minmax(0, 1fr); }
  .rung { font-size: 11px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><h1>Agent minds</h1><div class="sub" id="summary">Loading…</div></div>
    <div class="controls">
      <label title="Jump to the newest running agent automatically"><input type="checkbox" id="follow" checked> Follow live</label>
      <label><input type="checkbox" id="showEnded" checked> Show finished</label>
    </div>
    <div id="runs"></div>
  </aside>
  <dialog id="setup" aria-labelledby="setup-title"></dialog>
  <main><div class="wrap" id="detail"><div class="empty">No runs in the last 6 hours — start one with <code>npm run agent</code>.</div></div></main>
</div>
<script>
"use strict";
const MILESTONES = [["logs", "Logs"], ["wooden_pickaxe", "Wooden pickaxe"], ["stone", "Stone"], ["stone_pickaxe", "Stone pickaxe"], ["shelter", "Shelter"], ["survived_night", "Survived night"]];
const $ = (id) => document.getElementById(id);
let runs = [], selected = null, detail = null, serverOffset = 0;
const expanded = new Set(), calls = new Map();
try { const saved = JSON.parse(localStorage.getItem("minds") || "{}"); if (saved.follow === false) $("follow").checked = false; if (saved.showEnded === false) $("showEnded").checked = false; } catch {}
function save() { try { localStorage.setItem("minds", JSON.stringify({ follow: $("follow").checked, showEnded: $("showEnded").checked })); } catch {} }

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : String(kid));
  return e;
}
const words = (s) => String(s).replace(/_/g, " ");
const num = (n) => Number(n).toLocaleString();
function ago(ms) { const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + "s ago"; if (s < 3600) return Math.floor(s / 60) + "m ago"; return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m ago"; }
function dur(ms) { const s = ms / 1000; if (s < 10) return s.toFixed(1) + "s"; if (s < 60) return Math.round(s) + "s"; return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s"; }
/** 20 ticks a second; a Minecraft day is 24,000 ticks (20 minutes). */
/** "day 2, 21:40, night" from ticks since the run began and the time of day (6:00 is tick 0). */
function deathWhen(d) {
  const parts = [];
  if (d.ticks != null) parts.push("day " + (Math.floor(d.ticks / 24000) + 1));
  if (d.timeOfDay != null) {
    const mins = Math.floor(((d.timeOfDay / 1000 + 6) % 24) * 60);
    parts.push(String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0") + (d.timeOfDay >= 13000 && d.timeOfDay < 23000 ? ", night" : ", day"));
  }
  return parts.length ? parts.join(", ") : "step " + d.step;
}
// Newest three by default; the button shows them all. Kept across refreshes, reset when another agent is picked.
let deathsOpen = false;
const DEATHS_SHOWN = 3;
function deathsCard(deaths) {
  if (!deaths || !deaths.length) return null;
  const newest = deaths.slice().reverse();
  const shown = deathsOpen ? newest : newest.slice(0, DEATHS_SHOWN);
  const more = newest.length - DEATHS_SHOWN;
  return h("div", { class: "card" },
    h("div", { class: "tl-head" }, h("h3", {}, "Deaths · " + deaths.length), h("span", { class: "hint" }, "newest first · in-game day and time · what killed it · where · clock time")),
    h("div", { class: "deaths" }, shown.map((d) => h("div", { class: "death" },
      h("span", { class: "when" }, deathWhen(d)),
      h("span", { class: "cause" }, d.cause ? d.cause.replace(/^was /, "") : "cause not recorded"),
      h("span", { class: "where" }, d.where ? d.where.x + ", " + d.where.y + ", " + d.where.z : "—"),
      h("span", { class: "clock" }, new Date(d.at).toLocaleTimeString() + " · step " + d.step)))),
    more > 0 ? h("button", { class: "setup-btn", onclick: () => { deathsOpen = !deathsOpen; renderDetail(); } }, deathsOpen ? "Show the newest " + DEATHS_SHOWN : "Show all " + deaths.length + " (" + more + " more)") : null);
}
function game(ticks) { if (!ticks) return "0:00"; const s = Math.round(ticks / 20); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function argText(args) { const parts = Object.entries(args || {}).map(([k, v]) => (k === "count" ? "count " + v : k === "item" ? words(v) : words(k) + " " + words(v))); return parts.join(", "); }
function now() { return Date.now() + serverOffset; }
function isMet(r) { return r.ended === "goal met"; }
function statusBadge(r) {
  if (r.status === "starting") return h("span", { class: "badge running" }, h("span", { class: "dot running" }), "Starting · first decision on its way");
  if (r.status === "running") return h("span", { class: "badge running" }, h("span", { class: "dot running" }), "Running · step " + r.step);
  if (r.status === "stopped") return h("span", { class: "badge stopped" }, "Stopped — no end recorded");
  return h("span", { class: "badge " + (isMet(r) ? "met" : "ended") }, isMet(r) ? "✓ Goal met" : "Ended: " + r.ended);
}
function pips(r) { return h("div", { class: "pips", title: MILESTONES.map(([k, l]) => (r.milestones[k] ? "✓ " : "· ") + l).join("\n") }, MILESTONES.map(([k]) => h("span", { class: "pip" + (r.milestones[k] ? " on" : "") }))); }

function renderList() {
  const box = $("runs");
  const live = runs.filter((r) => r.status === "running" || r.status === "starting");
  const done = runs.filter((r) => r.status !== "running" && r.status !== "starting");
  $("summary").textContent = live.length + " running · " + done.length + " finished (last 6h)";
  const row = (r) => h("button", { class: "run" + (r.file === selected ? " sel" : ""), onclick: () => { $("follow").checked = false; save(); select(r.file); } },
    h("div", { class: "top" }, h("span", { class: "dot " + (r.status === "running" || r.status === "starting" ? "running" : r.status === "stopped" ? "stopped" : isMet(r) ? "met" : "") }),
      h("span", { class: "name" }, r.agent), h("span", { class: "when" }, r.status === "starting" ? (r.doing ? words(r.doing) : "starting") : r.status === "running" ? (r.doing ? words(r.doing) : "thinking") : ago(now() - r.lastAt))),
    h("div", { class: "meta", title: r.brain + " · " + r.brainDetail }, r.brain + (r.brainDetail.includes("context") ? " " + r.brainDetail.replace(/^local · /, "").replace(" context", "") : "") + (r.memory ? " · memory " + r.memory : "") + " · " + (r.status === "starting" ? "joining" : r.status === "running" ? "step " + r.step : r.ended)),
    pips(r));
  const kids = [];
  if (live.length) kids.push(h("div", { class: "group" }, "Running"), live.map(row));
  if ($("showEnded").checked && done.length) {
    // Finished runs grouped by batch (scripts/batch.sh NAME), newest batch first; one-off runs on their own.
    const groups = new Map();
    for (const r of done) { const k = r.batch ? "Finished · batch " + r.batch : "Finished"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
    for (const [k, list] of groups) kids.push(h("div", { class: "group" }, k + " (" + list.filter(isMet).length + "/" + list.length + " met goal)"), list.map(row));
  }
  if (!runs.length) kids.push(h("div", { class: "group" }, "No runs yet"));
  box.replaceChildren(...kids.flat());
}

function stat(k, v, title) { return h("div", { class: "stat", title }, h("div", { class: "k" }, k), h("div", { class: "v" }, v)); }

/** Consecutive identical decisions with the identical result become one row: loops read as "×18", not 18 rows. */
function groupTimeline(items) {
  const groups = [];
  for (const it of items) {
    const key = it.skill + JSON.stringify(it.args) + it.status + (it.reason || "");
    const g = groups[groups.length - 1];
    // Rationale wording and repeat notes vary within a loop; talking or the run ending is worth its own row.
    const plain = !it.say && !it.heard.length && !it.ended;
    if (g && g.key === key && plain && g.plain) { g.items.push(it); continue; }
    groups.push({ key, plain, items: [it] });
  }
  return groups;
}

function deltaView(delta) {
  const entries = Object.entries(delta);
  if (!entries.length) return null;
  return h("span", { class: "delta" }, entries.sort((a, b) => b[1] - a[1]).map(([k, v]) => h("span", { class: v > 0 ? "plus" : "minus" }, (v > 0 ? "+" : "−") + Math.abs(v) + " " + words(k))));
}
function sumDeltas(items) { const t = {}; for (const it of items) for (const [k, v] of Object.entries(it.delta)) t[k] = (t[k] || 0) + v; for (const k of Object.keys(t)) if (!t[k]) delete t[k]; return t; }

function callView(step) {
  const key = selected + "#" + step;
  const data = calls.get(key);
  if (!data) {
    fetch("/api/call?file=" + encodeURIComponent(selected) + "&step=" + step).then((r) => r.json()).then((j) => { calls.set(key, j); renderDetail(); }).catch(() => {});
    return h("div", { class: "callbox small" }, "Loading the model call…");
  }
  if (!data.calls || !data.calls.length) {
    return h("div", { class: "callbox" }, h("div", { class: "role" }, "Observation (no model — scripted)"), h("pre", {}, JSON.stringify(data.observation, null, 2)));
  }
  return h("div", { class: "callbox" }, data.calls.map((c, i) => h("div", {},
    data.calls.length > 1 ? h("div", { class: "sublabel" }, "Attempt " + (i + 1) + " of " + data.calls.length) : null,
    h("div", { class: "small" }, c.model + " · " + dur(c.ms) + " · " + num(c.inputTokens) + " in / " + num(c.outputTokens) + " out" + (c.stopReason ? " · stop: " + c.stopReason : "") + (c.request ? " · " + c.request.length + " turn" + (c.request.length === 1 ? "" : "s") + " sent" : "")),
    // Full memory resends the whole conversation; the last turn is what this decision answered.
    (c.request && c.request.length > 1) ? h("details", { class: "turn" }, h("summary", { class: "small" }, "Earlier conversation sent with it (" + (c.request.length - 1) + " turns)"),
      c.request.slice(0, -1).map((t) => h("div", { class: "turn" }, h("div", { class: "role" }, t.role === "user" ? "Observation" : "Model's earlier reply"), h("pre", {}, pretty(t.content))))) : null,
    (c.request || []).slice(-1).map((t) => h("div", { class: "turn" }, h("div", { class: "role" }, "Sent to model"), h("pre", {}, pretty(t.content)))),
    c.thinking ? h("div", { class: "turn" }, h("div", { class: "role" }, "Model reasoning"), h("pre", {}, c.thinking)) : null,
    h("div", { class: "turn" }, h("div", { class: "role" }, "Model replied"), h("pre", {}, pretty(c.text))))),
    data.system ? h("details", { class: "turn" }, h("summary", { class: "small" }, "System prompt"), h("pre", {}, data.system)) : null);
}
/** The run's setup in a modal: what the world was, what limited the run, and everything the model was told. */
function openSetup() {
  const dlg = $("setup"), file = selected;
  const head = h("div", { class: "dlg-head" }, h("h3", { id: "setup-title" }, "Run setup"), h("button", { class: "dlg-close", "aria-label": "Close", onclick: () => dlg.close() }, "×"));
  dlg.replaceChildren(head, h("div", { class: "dlg-body small" }, "Loading…"));
  if (!dlg.open) dlg.showModal();
  fetch("/api/setup?file=" + encodeURIComponent(file)).then((r) => (r.ok ? r.json() : null)).then((s) => {
    if (file !== selected || !dlg.open) return;
    if (!s) { dlg.replaceChildren(head, h("div", { class: "dlg-body" }, "No setup found for this run.")); return; }
    const rows = (pairs) => h("div", { class: "kv" }, pairs.filter(([, v]) => v != null && v !== "").flatMap(([k, v]) => [h("div", { class: "k" }, k), h("div", {}, v)]));
    const onOff = (b) => (b == null ? null : b ? "on" : "off");

      h("h4", {}, "World"),
      rows([["Scenario", s.scenario], ["Server setup", s.world ? h("pre", {}, s.world.join("\n")) : notLogged], ["Spawned at", s.spawn.x + ", " + s.spawn.y + ", " + s.spawn.z], ["Started", new Date(s.startedAt).toLocaleString()]]),
      h("h4", {}, "Agent"),

      h("h4", {}, "Limits"),
      rows([["Time budget", s.ticks != null ? num(s.ticks) + " ticks (" + game(s.ticks) + " of game time)" : notLogged], ["Cost cap", s.budgetUSD != null ? "$" + s.budgetUSD.toFixed(2) : null], ["Decision cap", s.maxSteps != null ? num(s.maxSteps) + " (a safety cap)" : null]]),
      h("h4", {}, "System prompt"),
      s.system ? h("pre", { style: "max-height:none" }, s.system) : h("div", { class: "small", style: "color:var(--faint)" }, "None: the scripted baseline uses no model."),
      s.system ? h("div", { class: "small", style: "color:var(--mute)" }, "Each decision also sends an observation that carries the goal above; open a step's model call to see one.") : null));

$("setup").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); }); // click on the backdrop closes it
function pretty(text) { try { return JSON.stringify(JSON.parse(text), null, 2); } catch { const m = /\{[\s\S]*\}/.exec(text); if (m) { try { return text.replace(m[0], JSON.stringify(JSON.parse(m[0]), null, 2)); } catch {} } return text; } }

function itemView(g) {
  const first = g.items[0], last = g.items[g.items.length - 1], n = g.items.length;
  const key = "g" + first.step;
  const open = expanded.has(key), callOpen = expanded.has("c" + last.step);
  const toggle = (k) => () => { expanded.has(k) ? expanded.delete(k) : expanded.add(k); renderDetail(); };
  const rationale = last.rationale;
  // Within a folded loop only the latest repeat note matters ("your last 132 decisions…"); interrupts all do.
  const all = g.items.flatMap((it) => it.events.filter((e) => /^your last|^interrupted/.test(e)));
  const repeats = all.filter((e) => /^your last/.test(e));
  const notes = all.filter((e) => !/^your last/.test(e)).concat(repeats.slice(-1));
  return h("div", { class: "item" },
    h("div", { class: "n" }, n > 1 ? first.step + "–" + last.step : "#" + first.step),
    h("div", {},
      h("div", { class: "line1" },
        last.skill ? h("span", { class: "skill" }, words(last.skill)) : h("span", { class: "skill" }, last.ended ? "Run ended" : "No decision"),
        last.skill ? h("span", { class: "args" }, argText(last.args)) : null,
        last.status ? h("span", { class: "st " + last.status }, last.status === "success" ? "worked" : last.status) : null,
        n > 1 ? h("span", { class: "times", title: n + " identical decisions in a row" }, "×" + n) : null,
        deltaView(sumDeltas(g.items))),
      last.reason ? h("div", { class: "reason " + last.status }, last.reason) : null,
      rationale ? h("div", { class: "rat" }, rationale) : null,
      last.plan ? h("div", { class: "small" }, h("span", { style: "color:var(--faint)" }, "Plan: "), last.plan) : null,
      last.heard.map((m) => h("div", { class: "say" }, "💬 " + m.from + " → " + m.to + ": " + m.text)),
      last.say ? h("div", { class: "say" }, "🗣 to " + last.say.to + ": " + last.say.text) : null,
      notes.map((t) => h("div", { class: "note" }, t)),
      last.ended ? h("div", { class: "ended-row" }, "■ Run ended: " + last.ended) : null,
      h("div", { class: "tools" },
        h("span", {}, "game " + game(last.ticks)),
        last.attempts ? h("span", {}, "thought " + dur(last.decisionMs) + (last.attempts > 1 ? " (" + last.attempts + " attempts)" : "")) : null,
        last.tokensIn ? h("span", {}, num(last.tokensIn) + " in / " + num(last.tokensOut) + " out") : null,
        n > 1 ? h("button", { class: "link", onclick: toggle(key) }, open ? "hide steps" : "show " + n + " steps") : null,
        last.skill ? h("button", { class: "link", onclick: toggle("c" + last.step) }, callOpen ? "hide model call" : last.attempts ? "show model call" : "show observation") : null),
      open ? h("ul", { class: "members" }, g.items.map((it) => h("li", {}, "#" + it.step + " · game " + game(it.ticks) + (Object.keys(it.delta).length ? " · " : ""), deltaView(it.delta)))) : null,
      callOpen ? callView(last.step) : null));
}

function renderDetail() {
  const box = $("detail");
  const starting = runs.find((r) => r.file === selected && r.status === "starting");
  if (!detail && starting) {
    const first = starting.live;
    box.replaceChildren(h("div", { class: "empty" }, h("b", {}, starting.agent), " (" + starting.brain + ") has joined the world. " +
      (first ? "Its first decision is under way; the full step appears here once it finishes." : "Its first decision will appear here as soon as it is made."),
      h("div", { class: "goal" }, h("b", {}, "Goal: "), starting.goal),
      first ? h("div", { class: "card now" }, h("div", {},
        h("h3", {}, "Doing now · since " + new Date(first.startedAt).toLocaleTimeString()),
        h("div", { class: "doing" }, words(first.skill) + " " + argText(first.args)),
        first.rationale ? h("div", { class: "why" }, first.rationale) : null)) : null));
    return;
  }
  if (!detail) { if (!runs.length) box.replaceChildren(h("div", { class: "empty" }, "No runs in the last 6 hours — start one with ", h("code", {}, "npm run agent"), ".")); return; }
  const r = detail.run, cur = detail.now, items = detail.timeline;
  const last = items[items.length - 1];
  const decisions = items.filter((i) => i.skill).length;
  const scroll = document.querySelector("main").scrollTop;
  // What it is doing now: decided, but not logged until the skill ends (see liveFileFor in minds.ts).
  const live = r.status === "running" ? detail.live : null;
  box.replaceChildren(
    h("div", { class: "head" },
      h("div", {},
        h("h2", {}, "Agent: " + r.agent),
        h("div", { class: "brain" }, r.brain + " · " + r.brainDetail + (r.memory ? " · memory: " + r.memory : "") + (r.comms != null ? " · comms " + (r.comms ? "on" : "off") : "") + (r.stance ? " · " + r.stance : "") + " · " + r.scenario),
        h("div", { class: "goal" }, h("b", {}, "Goal: "), r.goal),
        h("button", { class: "setup-btn", onclick: openSetup }, "Run setup: world, limits and full prompt")),
      h("div", { class: "spacer" }), statusBadge(r)),
    h("div", { class: "stats" },
      stat("Decisions", num(decisions)),
      stat("Deaths", num((detail.deaths || []).length), (detail.deaths || []).map((d) => deathWhen(d) + ": " + (d.cause || "cause not recorded")).join("\n")),
      stat("Game time", game(r.ticks), num(r.ticks) + " ticks · a day is 20:00"),
      stat("Typical think time", r.medianMs ? dur(r.medianMs) : "instant", "median per decision"),
      stat("Tokens", num(r.tokens)),
      stat("Cost", r.cost)),
    h("div", { class: "card" }, h("h3", {}, "Progress"),
      h("div", { class: "ladder" }, MILESTONES.map(([k, label]) => h("div", { class: "rung" + (r.milestones[k] ? " on" : "") }, h("div", { class: "ball" }, "✓"), h("div", {}, label), h("div", { class: "at" }, r.milestones[k] ? "step " + r.milestones[k] : "—"))))),
    deathsCard(detail.deaths),
    h("div", { class: "card now" },
      h("div", {},
        h("h3", {}, live ? "Doing now · since " + new Date(live.startedAt).toLocaleTimeString() : r.status === "running" ? "Latest decision · deciding the next one" : "Final decision"),
        live
          ? h("div", { class: "doing" }, words(live.skill) + " " + argText(live.args))
          : h("div", { class: "doing" }, (last && last.skill ? words(last.skill) + " " + argText(last.args) : last && last.ended ? "Run ended: " + last.ended : "—")),
        live ? (live.rationale ? h("div", { class: "why" }, live.rationale) : null) : last && last.rationale ? h("div", { class: "why" }, last.rationale) : null,
        live && last && last.skill ? h("div", { class: "why" }, "Before that: " + words(last.skill) + " " + argText(last.args) + (last.status ? " · " + last.status : "")) : null,
        cur.plan ? h("div", { class: "plan" }, h("b", {}, "Its plan: "), cur.plan) : null,
        h("div", { class: "vitals" },
          h("span", {}, "❤ " + cur.health + "/20"), h("span", {}, "🍗 " + cur.food + "/20"), h("span", {}, cur.isDay ? "☀ day" : "☾ night"),
          cur.hostiles.length ? h("span", { style: "color:var(--bad)" }, "⚠ " + cur.hostiles.map((x) => x.name + " " + x.distance + "m").join(", ")) : null,
          cur.otherAgents.length ? h("span", {}, "👥 " + cur.otherAgents.map((a) => a.name + " " + a.distance + "m").join(", ")) : null)),
      h("div", {},
        h("h3", {}, "Inventory"),
        Object.keys(cur.inventory).length ? h("div", { class: "chips" }, Object.entries(cur.inventory).sort((a, b) => b[1] - a[1]).map(([k, v]) => h("span", { class: "chip" }, v + " " + words(k)))) : h("div", { class: "small", style: "color:var(--faint)" }, "empty"),
        cur.canCraft.filter((k) => !cur.inventory[k]).length ? h("div", {}, h("div", { class: "sublabel" }, "Could craft right now"), h("div", { class: "chips" }, cur.canCraft.filter((k) => !cur.inventory[k]).map((k) => h("span", { class: "chip craft" }, words(k))))) : null)),
    h("div", { class: "card" },
      h("div", { class: "tl-head" }, h("h3", {}, "Timeline"), h("span", { class: "hint" }, "newest first · repeated identical decisions are folded together")),
      groupTimeline(items).reverse().map(itemView)));
  document.querySelector("main").scrollTop = scroll;
}

let detailSig = "";
function select(file) {
  if (file !== selected) {
    selected = file; detail = null; detailSig = ""; expanded.clear(); deathsOpen = false; document.querySelector("main").scrollTop = 0;
    if (file) history.replaceState(null, "", "#file=" + encodeURIComponent(file));
  }
  renderList();
  loadDetail();
}
function loadDetail() {
  if (!selected) { detail = null; renderDetail(); return; }
  const want = selected;
  fetch("/api/run?file=" + encodeURIComponent(want)).then((r) => (r.ok ? r.json() : null)).then((j) => {
    if (want !== selected) return;
    if (!j) { detail = null; renderDetail(); return; }
    const sig = j.timeline.length + "|" + j.run.status + "|" + (j.live ? j.live.step : "") + "|" + JSON.stringify(j.timeline[j.timeline.length - 1] || null);
    detail = j;
    if (linkedStep && !detailSig) expanded.add("c" + linkedStep[1]); // #file=…&step=N opens that step's model call
    if (sig !== detailSig) { detailSig = sig; renderDetail(); }
  }).catch(() => {});
}
function poll() {
  fetch("/api/runs").then((r) => r.json()).then((j) => {
    serverOffset = j.now - Date.now();
    runs = j.runs || [];
    const live = runs.find((r) => r.status === "running");
    if (($("follow").checked && live && live.file !== selected) || (!selected && runs[0]) || (selected && !runs.some((r) => r.file === selected))) {
      return select(($("follow").checked && live ? live : runs[0] || {}).file || null);
    }
    renderList();
    loadDetail();
  }).catch(() => { $("summary").textContent = "Panel server not reachable"; });
}
const linked = /file=([^&]+)/.exec(location.hash);
if (linked) { selected = decodeURIComponent(linked[1]); $("follow").checked = false; }
const linkedStep = /step=(\d+)/.exec(location.hash);
$("follow").addEventListener("change", () => { save(); poll(); });
$("showEnded").addEventListener("change", () => { save(); renderList(); });
poll();
setInterval(poll, 2000);
