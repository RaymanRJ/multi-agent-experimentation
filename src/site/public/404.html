<!doctype html>
<!-- CloudFront serves this, with a 404 status, for any missing path. Self-contained: no app bundle. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Agents, left alone</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f3ee;
        --text: #1b1d21;
        --muted: #5c626d;
        --accent: #0b7f6c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101214;
          --text: #e9ebee;
          --muted: #9aa1ab;
          --accent: #3cc7ad;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 17px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font: 600 34px/1.2 'Iowan Old Style', Charter, Georgia, serif;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There's nothing at this address.</p>
      <a href="/">Go to the overview</a>
    </main>
  </body>
</html>
